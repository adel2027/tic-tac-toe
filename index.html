<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إكس أو | XO Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

:root {
  --bg: #0a0a12;
  --card: rgba(20, 20, 35, 0.85);
  --accent: #00f5d4;
  --accent2: #7b2cbf;
  --x-color: #00f5d4;
  --o-color: #ff6b9d;
  --text: #e8e8f0;
  --muted: #8a8aa0;
  --glow: 0 0 20px rgba(0, 245, 212, 0.4);
  --glow-pink: 0 0 20px rgba(255, 107, 157, 0.4);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 20% 20%, rgba(123, 44, 191, 0.25) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(0, 245, 212, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(20, 20, 40, 1) 0%, transparent 70%);
  z-index: -1;
  pointer-events: none;
}

.container {
  width: min(95vw, 420px);
  height: min(95vh, 700px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  gap: 8px;
}

header {
  text-align: center;
  width: 100%;
}

header h1 {
  font-size: clamp(1.6rem, 5vw, 2.2rem);
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--accent2), var(--o-color));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 2px;
  margin-bottom: 2px;
}

.subtitle {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 400;
}

.scoreboard {
  display: flex;
  justify-content: space-between;
  width: 100%;
  gap: 10px;
  margin: 4px 0;
}

.score-box {
  flex: 1;
  background: var(--card);
  border-radius: 14px;
  padding: 8px 6px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(12px);
  transition: all 0.3s ease;
}

.score-box.active {
  border-color: var(--accent);
  box-shadow: var(--glow);
}

.score-box.o-active {
  border-color: var(--o-color);
  box-shadow: var(--glow-pink);
}

.score-label {
  font-size: 0.7rem;
  color: var(--muted);
  margin-bottom: 2px;
}

.score-value {
  font-size: 1.4rem;
  font-weight: 700;
}

.score-box.you .score-value { color: var(--x-color); }
.score-box.ai .score-value { color: var(--o-color); }
.score-box.draw .score-value { color: #ffd166; }

.status {
  font-size: 1rem;
  font-weight: 600;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  transition: all 0.3s;
}

.status.win { color: var(--x-color); text-shadow: var(--glow); }
.status.lose { color: var(--o-color); text-shadow: var(--glow-pink); }
.status.draw { color: #ffd166; }

.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  aspect-ratio: 1;
  max-width: 340px;
  margin: 0 auto;
}

.cell {
  background: var(--card);
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(2.5rem, 12vw, 3.8rem);
  font-weight: 900;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
  user-select: none;
}

.cell::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,245,212,0.08), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.cell:hover:not(.taken)::before {
  opacity: 1;
}

.cell:hover:not(.taken) {
  transform: scale(1.04);
  border-color: rgba(0,245,212,0.3);
  box-shadow: 0 0 15px rgba(0,245,212,0.15);
}

.cell.taken {
  cursor: default;
}

.cell.x {
  color: var(--x-color);
  text-shadow: 0 0 18px rgba(0,245,212,0.6);
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.cell.o {
  color: var(--o-color);
  text-shadow: 0 0 18px rgba(255,107,157,0.6);
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.cell.win-line {
  background: rgba(0,245,212,0.15);
  border-color: var(--accent);
  box-shadow: var(--glow);
}

.cell.win-line.o-win {
  background: rgba(255,107,157,0.15);
  border-color: var(--o-color);
  box-shadow: var(--glow-pink);
}

@keyframes popIn {
  0% { transform: scale(0.3); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.controls {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 340px;
}

.btn {
  flex: 1;
  padding: 12px 8px;
  border: none;
  border-radius: 14px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #00c9a7);
  color: #0a0a12;
  box-shadow: 0 4px 20px rgba(0,245,212,0.3);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(0,245,212,0.45);
}

.btn-secondary {
  background: var(--card);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.1);
}

.btn-secondary:hover {
  border-color: var(--accent2);
  background: rgba(123,44,191,0.2);
}

.difficulty {
  display: flex;
  gap: 6px;
  width: 100%;
  max-width: 340px;
  justify-content: center;
}

.diff-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: var(--muted);
  font-family: 'Cairo', sans-serif;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.diff-btn.active {
  background: rgba(0,245,212,0.15);
  border-color: var(--accent);
  color: var(--accent);
}

.diff-btn:hover:not(.active) {
  border-color: rgba(255,255,255,0.25);
  color: var(--text);
}

.footer {
  font-size: 0.7rem;
  color: var(--muted);
  opacity: 0.7;
}

/* Overlay for game over */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5,5,15,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  z-index: 100;
  backdrop-filter: blur(4px);
}

.overlay.show {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: var(--card);
  border-radius: 24px;
  padding: 28px 32px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.1);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  transform: scale(0.8);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 280px;
}

.overlay.show .modal {
  transform: scale(1);
}

.modal h2 {
  font-size: 1.6rem;
  margin-bottom: 8px;
}

.modal p {
  color: var(--muted);
  margin-bottom: 20px;
  font-size: 0.9rem;
}

.modal .btn {
  width: 100%;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>إكس أو</h1>
    <div class="subtitle">أنت ضد الذكاء الاصطناعي</div>
  </header>

  <div class="scoreboard">
    <div class="score-box you" id="youBox">
      <div class="score-label">أنت (X)</div>
      <div class="score-value" id="youScore">0</div>
    </div>
    <div class="score-box draw">
      <div class="score-label">تعادل</div>
      <div class="score-value" id="drawScore">0</div>
    </div>
    <div class="score-box ai" id="aiBox">
      <div class="score-label">الـ AI (O)</div>
      <div class="score-value" id="aiScore">0</div>
    </div>
  </div>

  <div class="status" id="status">دورك يا بطل 🔥</div>

  <div class="board" id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>

  <div class="difficulty">
    <button class="diff-btn" data-d="easy">سهل</button>
    <button class="diff-btn active" data-d="medium">متوسط</button>
    <button class="diff-btn" data-d="hard">صعب</button>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="restartBtn">لعبة جديدة</button>
    <button class="btn btn-secondary" id="resetScore">تصفير النقاط</button>
  </div>

  <div class="footer">صُنع بـ ❤️ | GitHub Pages</div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">فزت! 🎉</h2>
    <p id="modalText">أحسنت يا وحش</p>
    <button class="btn btn-primary" id="playAgain">العب تاني</button>
  </div>
</div>

<script>
const cells = document.querySelectorAll('.cell');
const statusEl = document.getElementById('status');
const youScoreEl = document.getElementById('youScore');
const aiScoreEl = document.getElementById('aiScore');
const drawScoreEl = document.getElementById('drawScore');
const youBox = document.getElementById('youBox');
const aiBox = document.getElementById('aiBox');
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');

let board = Array(9).fill(null);
let currentPlayer = 'X';
let gameOver = false;
let difficulty = 'medium';
let scores = { you: 0, ai: 0, draw: 0 };

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWinner(b) {
  for (let [a,c,d] of wins) {
    if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a,c,d] };
  }
  if (b.every(c => c)) return { winner: 'draw' };
  return null;
}

function minimax(b, depth, isMax, alpha, beta) {
  const result = checkWinner(b);
  if (result) {
    if (result.winner === 'O') return 10 - depth;
    if (result.winner === 'X') return depth - 10;
    return 0;
  }
  if (isMax) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false, alpha, beta));
        b[i] = null;
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true, alpha, beta));
        b[i] = null;
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
    }
    return best;
  }
}

function getBestMove() {
  if (difficulty === 'easy') {
    const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
    // 70% random, 30% best
    if (Math.random() < 0.7) return empty[Math.floor(Math.random() * empty.length)];
  }
  if (difficulty === 'medium') {
    const empty = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
    // 40% random
    if (Math.random() < 0.4) return empty[Math.floor(Math.random() * empty.length)];
  }
  // Hard or when not random: full minimax
  let bestScore = -Infinity;
  let move = -1;
  for (let i = 0; i < 9; i++) {
    if (!board[i]) {
      board[i] = 'O';
      const score = minimax(board, 0, false, -Infinity, Infinity);
      board[i] = null;
      if (score > bestScore) {
        bestScore = score;
        move = i;
      }
    }
  }
  return move;
}

function aiMove() {
  if (gameOver) return;
  statusEl.textContent = 'الـ AI بيفكر... 🤔';
  aiBox.classList.add('o-active');
  youBox.classList.remove('active');
  
  setTimeout(() => {
    const move = getBestMove();
    if (move === -1) return;
    board[move] = 'O';
    cells[move].textContent = 'O';
    cells[move].classList.add('o', 'taken');
    
    const result = checkWinner(board);
    if (result) endGame(result);
    else {
      currentPlayer = 'X';
      statusEl.textContent = 'دورك يا بطل 🔥';
      aiBox.classList.remove('o-active');
      youBox.classList.add('active');
    }
  }, 400 + Math.random() * 300);
}

function handleClick(e) {
  const i = +e.target.dataset.i;
  if (board[i] || gameOver || currentPlayer !== 'X') return;
  
  board[i] = 'X';
  e.target.textContent = 'X';
  e.target.classList.add('x', 'taken');
  
  const result = checkWinner(board);
  if (result) endGame(result);
  else {
    currentPlayer = 'O';
    youBox.classList.remove('active');
    aiMove();
  }
}

function endGame(result) {
  gameOver = true;
  youBox.classList.remove('active');
  aiBox.classList.remove('o-active');
  
  if (result.winner === 'X') {
    scores.you++;
    youScoreEl.textContent = scores.you;
    statusEl.textContent = 'فزت! 🎉';
    statusEl.className = 'status win';
    modalTitle.textContent = 'فزت! 🎉';
    modalText.textContent = 'أنت الأسطوري! أحسنت';
    if (result.line) result.line.forEach(i => cells[i].classList.add('win-line'));
  } else if (result.winner === 'O') {
    scores.ai++;
    aiScoreEl.textContent = scores.ai;
    statusEl.textContent = 'الـ AI فاز 😤';
    statusEl.className = 'status lose';
    modalTitle.textContent = 'خسرت 😅';
    modalText.textContent = 'الـ AI كان أقوى هالمرة';
    if (result.line) result.line.forEach(i => {
      cells[i].classList.add('win-line', 'o-win');
    });
  } else {
    scores.draw++;
    drawScoreEl.textContent = scores.draw;
    statusEl.textContent = 'تعادل! 🤝';
    statusEl.className = 'status draw';
    modalTitle.textContent = 'تعادل! 🤝';
    modalText.textContent = 'مباراة قوية من الطرفين';
  }
  
  setTimeout(() => overlay.classList.add('show'), 600);
}

function resetBoard() {
  board = Array(9).fill(null);
  gameOver = false;
  currentPlayer = 'X';
  statusEl.textContent = 'دورك يا بطل 🔥';
  statusEl.className = 'status';
  cells.forEach(c => {
    c.textContent = '';
    c.className = 'cell';
  });
  overlay.classList.remove('show');
  youBox.classList.add('active');
  aiBox.classList.remove('o-active');
}

function resetScores() {
  scores = { you: 0, ai: 0, draw: 0 };
  youScoreEl.textContent = '0';
  aiScoreEl.textContent = '0';
  drawScoreEl.textContent = '0';
  resetBoard();
}

cells.forEach(c => c.addEventListener('click', handleClick));
document.getElementById('restartBtn').addEventListener('click', resetBoard);
document.getElementById('playAgain').addEventListener('click', resetBoard);
document.getElementById('resetScore').addEventListener('click', resetScores);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.d;
    resetBoard();
  });
});

// Start
youBox.classList.add('active');
</script>
</body>
</html>
